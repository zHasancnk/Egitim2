<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f68">
<title>Benimle Öğren</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --accent:#1f6f68;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,white);
  --bg:#faf7f2; --ink:#1f2933; --muted:#5b6670; --line:#e4ddd0; --card:#fff;
  --ok:#2e7d32; --radius:22px;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Lexend,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:4px solid #f2a900;outline-offset:3px}
h1,h2,h3{margin:0}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.title{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:700;color:var(--accent)}
.sub{font-size:1.4rem;color:var(--muted);margin:0}
.btn{min-height:64px;padding:12px 28px;border-radius:var(--radius);background:var(--card);border:3px solid var(--line);font-weight:600;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.lg{min-height:80px;font-size:1.4rem;padding:12px 34px}
.btn.xl{min-height:100px;font-size:2rem;padding:16px 64px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.adult{position:fixed;right:14px;bottom:14px;background:transparent;color:var(--muted);font-size:.9rem;padding:10px 14px;border-radius:12px;text-decoration:underline}
.bar{display:flex;align-items:center;gap:16px;padding:14px 18px}
.bar .back{min-height:64px;min-width:64px;padding:0 20px;font-size:1.6rem}
.dots{display:flex;gap:10px;flex:1;justify-content:flex-end;flex-wrap:wrap}
.d{width:18px;height:18px;border-radius:50%;background:#ddd5c6;display:inline-block}
.d.done{background:var(--accent)}
.d.cur{background:#fff;border:5px solid var(--accent)}
.stars{font-size:1.6rem;color:#c98a00;letter-spacing:4px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:760px;margin:10px auto;padding:20px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:28px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:1.8rem;font-weight:700;color:var(--accent);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:3.6rem}
.tile[disabled]{opacity:.4}
.note{max-width:620px;margin:10px auto;padding:16px 20px;background:var(--accent-soft);border-radius:16px;text-align:center}
.stage{display:flex;flex-direction:column;align-items:center;gap:22px;padding:10px 18px 40px}
.pic{width:min(70vw,340px);aspect-ratio:1;background:#fff;border:3px solid var(--line);border-radius:30px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.pic img{width:100%;height:100%;object-fit:cover}
.emoji{font-size:min(38vw,10rem);line-height:1}
.word{font-size:clamp(2.4rem,10vw,4rem);font-weight:700}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.sylrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{min-height:64px;min-width:80px;padding:6px 22px;border-radius:18px;background:#fff;border:3px solid var(--line);font-size:1.8rem;font-weight:700}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mic.rec{background:#b3261e;border-color:#b3261e;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;width:min(100%,640px)}
.choice{aspect-ratio:1;background:#fff;border:4px solid var(--line);border-radius:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0}
.choice img{width:100%;height:100%;object-fit:cover}
.choice .emoji{font-size:5rem}
.choice.dim{opacity:.35}
.choice.ok{border-color:var(--ok);box-shadow:0 0 0 6px #c8e6c9}
.canvaswrap{position:relative;width:min(88vw,420px);aspect-ratio:1;background:#fff;border:3px solid var(--line);border-radius:26px;overflow:hidden}
.canvaswrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.okmsg{color:var(--ok);font-weight:700;font-size:1.4rem;min-height:1.6em}
.quiet{background:transparent;color:var(--muted);text-decoration:underline;min-height:48px}
/* panel */
.panel{max-width:900px;margin:0 auto;padding:16px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:12px 18px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:600}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.box h3{margin-bottom:8px}
.box p,.box li{color:var(--muted);line-height:1.5;font-size:.95rem}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rt{flex:1;font-size:1.1rem;font-weight:600}
.rt small{color:var(--muted);font-weight:400}
.st{font-size:.8rem;padding:4px 10px;border-radius:99px;background:#eee}
.st.ok{background:#c8e6c9;color:#1b5e20}
.icon{min-width:52px;min-height:52px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:1.1rem}
.icon.recording{background:#b3261e;color:#fff;border-color:#b3261e}
.icon[disabled]{opacity:.35}
.guide{background:var(--accent-soft);border:3px solid var(--accent);border-radius:22px;padding:22px;text-align:center;margin-bottom:16px}
.gtext{font-size:2.4rem;font-weight:700;margin:14px 0}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],select{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:48px}
.swatch{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 4px var(--ink)}
.thumb{width:56px;height:56px;border-radius:12px;background:#f1ece2;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2rem}
.thumb img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
.pin{display:flex;gap:14px;justify-content:center;margin:12px 0}
.pin i{width:22px;height:22px;border-radius:50%;background:#ddd5c6}
.pin i.f{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center}
.keypad .btn{min-height:76px;padding:0;font-size:1.6rem}
.err{color:#b3261e;font-weight:600;min-height:1.5em}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#1f2933;color:#fff;padding:14px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Bu uygulama JavaScript gerektirir.</noscript>
<script src="app.js"></script>
</body>
</html>
