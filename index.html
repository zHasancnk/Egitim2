<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c5cff">
<title>Benimle Öğren</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="learn.css">
<style>
:root{
  --accent:#7c5cff;
  --accent-soft:color-mix(in srgb,var(--accent) 12%,white);
  --bg:#faf7f2; --ink:#1f2933; --muted:#5b6670; --line:#e4ddd0; --card:#fff;
  --ok:#2e7d32; --warn:#8a5a00; --bad:#b3261e; --radius:22px;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Lexend,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:4px solid #f2a900;outline-offset:3px}
h1,h2,h3{margin:0}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
.title{font-size:clamp(2.2rem,8vw,3.6rem);font-weight:700;color:var(--accent)}
.sub{font-size:1.4rem;color:var(--muted);margin:0}
.btn{min-height:64px;padding:12px 28px;border-radius:var(--radius);background:var(--card);border:3px solid var(--line);font-weight:600;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.lg{min-height:80px;font-size:1.4rem;padding:12px 34px}
.btn.xl{min-height:100px;font-size:2rem;padding:16px 64px}
.btn.sm{min-height:48px;padding:6px 16px;font-size:.95rem;border-width:2px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.emoji{line-height:1}
.thumb .emoji{font-size:2rem}
.quiet{background:transparent;color:var(--muted);text-decoration:underline;min-height:48px}
/* panel */
.panel{max-width:920px;margin:0 auto;padding:16px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:12px 18px;border-radius:14px;background:#fff;border:2px solid var(--line);font-weight:600}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.box{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.box h3{margin-bottom:8px}
.box p,.box li{color:var(--muted);line-height:1.5;font-size:.95rem}
.box p b{color:var(--ink)}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rrow:first-of-type{border-top:0}
.rt{flex:1;min-width:120px;font-size:1.1rem;font-weight:600}
.rt small{color:var(--muted);font-weight:400}
.st{font-size:.8rem;padding:4px 10px;border-radius:99px;background:#eee;white-space:nowrap}
.st.ok{background:#c8e6c9;color:#1b5e20}
.st.ai{background:#dbe9ff;color:#143a7a}
.st.flag{background:#ffe0b2;color:#7a3e00}
.icon{min-width:48px;min-height:48px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:1.05rem}
.icon.recording{background:var(--bad);color:#fff;border-color:var(--bad)}
.icon[disabled]{opacity:.35}
.inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=url],select,textarea{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:48px;max-width:100%}
input.wide{flex:1;min-width:220px}
.swatch{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch.on{box-shadow:0 0 0 4px var(--ink)}
.thumb{width:56px;height:56px;border-radius:12px;background:#f1ece2;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2rem}
.thumb img{width:100%;height:100%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;border-top:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:left}
.pin{display:flex;gap:14px;justify-content:center;margin:12px 0}
.pin i{width:22px;height:22px;border-radius:50%;background:#ddd5c6}
.pin i.f{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:12px;justify-content:center}
.keypad .btn{min-height:76px;padding:0;font-size:1.6rem}
.err{color:var(--bad);font-weight:600;min-height:1.5em}
.progress{height:16px;background:#e9e2d4;border-radius:99px;overflow:hidden;margin:10px 0}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.passage{font-size:1.1rem;line-height:1.75;background:var(--accent-soft);padding:14px 16px;border-radius:14px;color:var(--ink)}
.warn{color:var(--warn);background:#fff4d6;padding:8px 12px;border-radius:10px;margin:8px 0;font-size:.92rem}
.good{color:#1b5e20;background:#e3f4e4;padding:8px 12px;border-radius:10px;margin:8px 0;font-size:.92rem}
.consent{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px;background:#fffdf8;line-height:1.5;font-size:.95rem}
.consent input{width:26px;height:26px;margin-top:2px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-size:.9rem;font-weight:600}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kv div{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.kv b{display:block;font-size:1.3rem;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#1f2933;color:#fff;padding:14px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:50;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Bu uygulama JavaScript gerektirir.</noscript>
<script src="core.js"></script>
<script src="data.js"></script>
<script src="pics.js"></script>
<script src="passage.js"></script>
<script src="voice.js"></script>
<script src="qr.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="fx.js"></script>
<script src="learn.js"></script>
<script src="main.js"></script>
</body>
</html>
