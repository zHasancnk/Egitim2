<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<meta name="description" content="Güneşim Öğreniyor — ailenin kendi sesiyle Down sendromu bireyler için eğitim.">
<title>Güneşim Öğreniyor ☀️</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Güneşim">
<link rel="apple-touch-icon" href="ikon-192.svg">
<link rel="stylesheet" href="stiller.css">
</head>
<body>
<header id="ustbar" hidden>
  <span id="yildiz">⭐ 0</span>
  <span id="baslik-orta">☀️ Güneşim</span>
  <span id="sure">⏱ 15:00</span>
</header>
<main id="ekran" aria-live="polite">
  <div class="orta"><div class="buyuk-emoji">☀️</div><p>Yükleniyor...</p></div>
  <noscript><div class="orta"><h1>JavaScript kapalı</h1>
  <p>Bu uygulama için tarayıcıda JavaScript açık olmalı.</p></div></noscript>
</main>
<div id="bilgi" role="status" aria-live="polite"></div>
<script>
/* Önyükleme bekçisi: uygulama açılmadan hata olursa beyaz ekran yerine
   nedenini ve çözümünü gösterir. */
window.__hatalar = [];
window.addEventListener('error', function (e) {
  var t = e.target || {};
  var mesaj;
  if (t.tagName === 'SCRIPT' || t.tagName === 'LINK') {
    var yol = (t.src || t.href || '').split('/').slice(-2).join('/');
    mesaj = 'Dosya yüklenemedi: ' + yol + ' (repoya eksik yüklenmiş olabilir)';
  } else {
    mesaj = 'JS hatası: ' + (e.message || '') +
      ' (' + ((e.filename || '').split('/').pop() || '?') + ':' + (e.lineno || '?') + ')';
  }
  window.__hatalar.push(mesaj);
  var ekran = document.getElementById('ekran');
  if (ekran && !window.__uygulamaBasladi) {
    var liste = window.__hatalar.map(function (m) { return '<li>' + m + '</li>'; }).join('');
    ekran.innerHTML =
      '<div class="orta"><div class="buyuk-emoji">😕</div><h1>Sayfa açılamadı</h1></div>' +
      '<div class="kutu"><b>Bulgu:</b><ul>' + liste + '</ul>' +
      '<b>Çözüm:</b><ol>' +
      '<li>Adresin <b>...github.io/REPO-ADI/</b> ile bittiğinden emin olun.</li>' +
      '<li>Repoda şu dosyalar olmalı: index.html, manifest.webmanifest, sw.js, ' +
      'stiller.css, icerik.js, db.js, ses.js, zip.js, app.js, panel.js, ikon-192.svg, ikon-512.svg.</li>' +
      '<li><b>Ctrl+Shift+R</b> ile önbelleksiz yenileyin.</li>' +
      '<li>Olmazsa F12 → Console sekmesindeki kırmızı yazıyı gönderin.</li>' +
      '</ol></div>';
  }
}, true);
</script>
<script src="icerik.js"></script>
<script src="db.js"></script>
<script src="ses.js"></script>
<script src="zip.js"></script>
<script src="app.js"></script>
<script src="panel.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
